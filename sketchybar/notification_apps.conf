# The apps whose notifications SketchyBar counts in its green badge (plugins/notification.sh), and
# whose windows have a green dot among the workspaces: the badge on their icon in the Dock, e.g.
# the unread messages. One per line, by bundle id, which `osascript -e 'id of app "Name"'` prints,
# or by the name in the Dock; # starts a comment.
# notification.sh reads this file every 2 seconds, so a change needs no reload

com.tinyspeck.slackmacgap  # Slack
net.whatsapp.WhatsApp      # WhatsApp
