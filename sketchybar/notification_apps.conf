# The apps whose notifications SketchyBar counts in its green badge (plugins/notification.sh): the
# badge on their icon in the Dock, e.g. the unread messages. Among the workspaces the windows of
# every app with a badge have a green dot, also of those not here. One per line, by bundle id, which
# `osascript -e 'id of app "Name"'` prints, or by the name in the Dock; # starts a comment.
# notification.sh reads this file every 2 seconds, so a change needs no reload

com.tinyspeck.slackmacgap  # Slack
com.microsoft.teams2       # Microsoft Teams
